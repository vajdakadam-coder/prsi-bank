<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Počítadlo lebek a banku pro karetní hru prší s vyúčtováním a QR Platbou.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prší Bank">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Prší Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tracking@1.1.3/build/tracking-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tracking@1.1.3/build/data/face-min.js"></script>
<style>
/* Layout: one column of full-width colour bars (one per player), floating round controls on top, bank pill under them, sheets slide up from the bottom */
:root{
  --bg:#ffffff; --surface:#f3f3f6; --surface-2:#e9e9ef; --ink:#111114; --muted:#76767f; --line:rgba(17,17,20,.08);
  --glass:rgba(255,255,255,.78); --accent:#2f7bf6; --danger:#f0453a; --ok:#21b25f;
  --shadow:0 8px 28px rgba(20,20,40,.10), 0 1px 2px rgba(20,20,40,.06);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Figtree", system-ui, "Segoe UI", sans-serif;
  --f-round:ui-rounded, "SF Pro Rounded", "Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0e; --surface:#18181d; --surface-2:#23232a; --ink:#f5f5f7; --muted:#9a9aa5; --line:rgba(255,255,255,.08);
  --glass:rgba(30,30,36,.78); --accent:#5b9bff; --danger:#ff5d52; --ok:#3ed37f;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0b0e; --surface:#18181d; --surface-2:#23232a; --ink:#f5f5f7; --muted:#9a9aa5; --line:rgba(255,255,255,.08);
  --glass:rgba(30,30,36,.78); --accent:#5b9bff; --danger:#ff5d52; --ok:#3ed37f;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 140px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top controls */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.fab,.pillbar{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);border:1px solid var(--line)}
.fab{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.pillbar{display:flex;border-radius:999px;height:52px;padding:0 6px}
.pillbar button{width:52px;height:52px;display:grid;place-items:center;color:var(--accent);border-radius:50%}
.fab:active,.pillbar button:active{transform:scale(.92)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* bank */
.bank{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 6px 14px;flex-wrap:wrap}
.bank .lbl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bank .amt{font-family:var(--f-round);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:1;letter-spacing:-.02em}
.bank .amt small{font-size:.42em;font-weight:700;margin-left:4px;color:var(--muted)}
.bank .meta{font-size:14px;color:var(--muted);text-align:right}
.bank .meta b{color:var(--ink)}

/* rows */
.rows{display:flex;flex-direction:column;gap:12px}
.row{--t:#fff;background:var(--c);color:var(--t);border-radius:22px;min-height:92px;padding:10px 10px 10px 16px;
  display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:4px;position:relative;
  transition:filter .25s, opacity .25s, transform .15s}
.row .who{text-align:left;min-width:0;padding:6px 0;color:inherit}
.row .nm{display:block;font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{display:block;font-size:13px;font-weight:600;opacity:.8;min-height:18px}
.pm{width:52px;height:60px;border-radius:16px;display:grid;place-items:center;color:inherit}
.pm svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.pm:active{background:rgba(255,255,255,.18);transform:scale(.9)}
.pm:disabled{opacity:.3;cursor:default;transform:none;background:none}
.dots{display:flex;gap:7px;padding:0 6px;justify-content:center;min-width:64px}
.dot{font-style:normal;font-size:24px;line-height:1;opacity:.28;filter:grayscale(1);transition:transform .2s, opacity .2s, filter .2s}
.dot::before{content:"☠️"}
.dot.on{opacity:1;filter:none;transform:scale(1.08)}
.dot.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.out-tag{font-family:var(--f-round);font-weight:900;font-size:30px;letter-spacing:.04em;padding:0 8px;min-width:64px;text-align:center}
.row.out{filter:saturate(.15) brightness(.92);opacity:.55}
.row.danger::after{content:"";position:absolute;inset:-3px;border-radius:25px;border:3px solid var(--c);opacity:.5;animation:pulse 1.6s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{inset:-7px;opacity:0}}
.row.win{transform:scale(1.015)}

.bench{margin-top:22px}
.bench h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:999px;background:var(--surface);font-weight:600}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.note{color:var(--muted);font-size:14px;margin:12px 6px 0}
.emptyrow{border:2px dashed var(--surface-2);border-radius:22px;padding:26px;text-align:center;color:var(--muted)}

/* bottom action bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:12px max(16px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  background:linear-gradient(to top, var(--bg) 60%, transparent)}
.dock .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:22px;padding:12px 12px 12px 20px;box-shadow:var(--shadow);animation:rise .3s ease-out}
.dock .in.win{background:var(--c);color:var(--t)}
.dock .txt{flex:1;min-width:0;font-weight:600;line-height:1.25}
.dock .txt b{display:block;font-size:19px;font-weight:800}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.btn{border-radius:14px;padding:13px 18px;font-weight:700;background:var(--surface);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}
.btn.inv{background:var(--bg);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.dng{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .card{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;
  padding:10px max(20px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));
  animation:slide .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{transform:translateY(60px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-2);margin:2px auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sh-head h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.close{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.close svg{width:18px;height:18px}
.group{background:var(--surface);border-radius:18px;padding:4px 16px;margin-bottom:16px}
.group .it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.group .it:first-child{border-top:0}
.group .it label{font-weight:600}
.gl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 4px}
.inp{width:100%;background:var(--surface);border:2px solid transparent;border-radius:14px;padding:13px 14px;font-size:17px}
.inp:focus{outline:none;border-color:var(--accent)}
.group .inp{background:var(--bg)}
.inp.sm{width:110px;text-align:right;padding:9px 12px}
.inp.bad{border-color:var(--danger)}
.hint{font-size:13px;color:var(--muted);margin:6px 4px 16px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
.sw{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--c);position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg), 0 0 0 6px var(--c)}
.preview{border-radius:22px;padding:20px 22px;margin-bottom:16px;font-size:24px;font-weight:700;background:var(--c);color:var(--t);display:flex;justify-content:space-between;align-items:center}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(20px)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .grow{flex:1}

/* split */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.duo .p{border-radius:20px;padding:14px;background:var(--c);color:var(--t);min-width:0}
.duo .p .n{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo .p .s{font-size:13px;opacity:.85;margin-bottom:8px}
.duo .p input{width:100%;background:rgba(255,255,255,.22);border:0;border-radius:12px;padding:10px;font-size:26px;font-weight:800;color:inherit;font-family:var(--f-round)}
.duo .p input:focus{outline:2px solid currentColor}
.duo .p .net{font-size:13px;font-weight:600;margin-top:6px;opacity:.9}
.range{width:100%;accent-color:var(--accent);margin:4px 0 10px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.err{color:var(--danger);font-size:14px;font-weight:600;min-height:20px;margin:4px}

/* settlement */
.xf{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.xf:first-child{border-top:0}
.xf .tx{flex:1 1 180px;min-width:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--c);color:var(--t);font-weight:700;font-size:15px}
.tag i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.arrow{color:var(--muted)}
.money{font-family:var(--f-round);font-weight:800;font-size:20px;white-space:nowrap}
.qrbox{width:100%;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 0 4px}
.qr{background:#fff;padding:8px;border-radius:14px;line-height:0}
.qr svg{width:170px;height:170px;max-width:100%}
.qrmeta{flex:1 1 160px;min-width:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.qrmeta b{color:var(--ink)}
.bal{display:grid;grid-template-columns:minmax(70px,1fr) 2fr auto;gap:10px;align-items:center;padding:8px 0}
.bal .w{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:10px;border-radius:5px;background:var(--bg)}
.track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--surface-2)}
.fill{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--c)}
.fill.pos{left:50%}.fill.neg{right:50%}
.bal .a{font-weight:700;min-width:90px;text-align:right}
.pos-t{color:var(--ok)}.neg-t{color:var(--danger)}
.hist .h{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hist .h:first-child{border-top:0}
.hist .no{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.hist .d{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hist .d small{width:100%;color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 0}
/* avatars, parties, people */
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;background:rgba(255,255,255,.24);color:inherit;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xs{width:24px;height:24px;font-size:11px;background:var(--c);color:var(--t);box-shadow:0 0 0 2px var(--bg)}
.tag .av.xs{box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.av.lg{width:88px;height:88px;font-size:36px;background:var(--c);color:var(--t);box-shadow:none}
.row .who{display:flex;align-items:center;gap:12px}
.row .who .tx{min-width:0;flex:1}
.photo{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.photo .bt{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.acctrow{display:flex;gap:8px}
.acctrow .inp{flex:1;min-width:0}
.acctrow .btn{display:inline-flex;align-items:center;gap:6px}
.acctrow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.person{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);font-weight:600}
.person .av{width:30px;height:30px;font-size:13px;background:var(--c);color:var(--t);box-shadow:none}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.party{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.party:first-child{border-top:0}
.party .pi{flex:1 1 160px;min-width:0}
.party .pn{font-weight:700;font-size:17px}
.party .pm2{font-size:13px;color:var(--muted)}
.stack{display:flex;margin-top:6px}
.stack .av.xs{margin-left:-6px}.stack .av.xs:first-child{margin-left:0}
.party .pb{display:flex;gap:6px;flex-wrap:wrap}
.count{font-weight:700;color:var(--muted);font-size:14px}
.swipe{position:relative;border-radius:22px}
.swipe .row{touch-action:pan-y;z-index:1}
.trash{position:absolute;inset:0;border-radius:22px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:26px;font-weight:800;font-size:16px;visibility:hidden}
.trash svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.swipe.sw-on .trash{visibility:visible}
.swipe.sw-on .row.out{opacity:1}
.toast button{margin-left:12px;font-weight:800;color:inherit;text-decoration:underline;padding:0}
.cropper{background:var(--surface);border-radius:20px;padding:16px 16px 4px;margin:-6px 0 18px}
.cropper canvas{display:block;width:200px;height:200px;max-width:100%;border-radius:50%;margin:0 auto 12px;touch-action:none;cursor:grab;box-shadow:0 0 0 4px var(--bg), 0 0 0 7px var(--c, var(--accent));background:var(--surface-2)}
.cz{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;max-width:300px;margin:0 auto}
.cz .range{margin:0;flex:1}
.pswipe{position:relative;display:inline-flex;border-radius:999px;max-width:100%}
.pswipe .person{position:relative;z-index:1;touch-action:pan-y;transition:transform .2s;max-width:100%}
.ptrash{position:absolute;inset:0;border-radius:999px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-weight:800;font-size:14px;visibility:hidden;cursor:pointer}
.pswipe.on .ptrash{visibility:visible}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;box-shadow:var(--shadow);animation:fade .2s;max-width:calc(100% - 32px);text-align:center}
@media (max-width:420px){
  .row{padding-left:12px;min-height:84px}
  .row .who{gap:10px}
  .av{width:40px;height:40px;font-size:16px}
  .row .nm{font-size:21px}
  .pm{width:44px}
  .dots{gap:3px;min-width:56px;padding:0 2px}
  .dot{font-size:20px}
  .bal{grid-template-columns:1fr auto}.bal .track{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="pillbar">
    <button id="b-set" aria-label="Nastavení">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button id="b-party" aria-label="Party">

      </button>

</div>
<div class="dock" id="dock" hidden></div>

<script>
(function(){
const LS = 'prsi-bank-v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kc = n => Math.round(n).toLocaleString('cs-CZ') + ' Kč';
const signed = n => (n>0?'+':n<0?'−':'') + Math.abs(Math.round(n)).toLocaleString('cs-CZ') + ' Kč';
const COLORS = ['#4f8ff7','#b552f2','#e65fa9','#f05a4a','#f27b2d','#f5d65a','#94de5c','#2ec4a6','#3fc1f0','#6a5cff','#ff8fb1','#8b8b99'];
const ICON_MINUS = '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>';
const ICON_PLUS = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_X = '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function textOn(hex){
  const h = hex.replace('#',''); const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) > 175 ? '#111114' : '#ffffff';
}
const cvars = c => `--c:${c};--t:${textOn(c)}`;

function seed(){
  return { players: [],
    stake:100, limit:3, rounds:[], cur:null, sample:false };
}
function load(){
  try{ const raw = localStorage.getItem(LS); if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.players)) return s; } }catch(e){}
  return null;
}
let S = (window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.S) || load() || seed();
S.players.forEach((p,i) => { if(!p.color) p.color = COLORS[i % COLORS.length]; });
S.people = S.people || {}; S.parties = S.parties || [];
const remember = p => { S.people[p.id] = {id:p.id, name:p.name, acct:p.acct || '', color:p.color, photo:p.photo || ''}; };
S.players.forEach(remember);
let lastHit = null, confirmKey = null, pendingOut = null;
function flipRender(){
  const before = {};
  document.querySelectorAll('[data-row]').forEach(el => before[el.dataset.row] = el.getBoundingClientRect().top);
  render();
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-row]').forEach(el => {
    const b = before[el.dataset.row]; if(b == null) return;
    const d = b - el.getBoundingClientRect().top; if(!d) return;
    el.animate([{transform:`translateY(${d}px)`}, {transform:'translateY(0)'}], {duration:450, easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){ toast('Úložiště v prohlížeči je plné, část dat se neuložila'); } }
try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({S})); }catch(e){}

const P = id => S.players.find(p => p.id === id) || S.people[id] || {id, name:'?', acct:'', color:'#8b8b99'};
const initials = n => (n || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const avatar = (p, cls = '') => `<span class="av ${cls}" style="${cvars(p.color)}" aria-hidden="true">${p.photo ? `<img src="${p.photo}" alt="">` : esc(initials(p.name))}</span>`;
function ibanToLocal(iban){
  if(!/^CZ\d{22}$/.test(iban)) return iban;
  const bank = iban.slice(4,8), pre = iban.slice(8,14).replace(/^0+/,''), num = iban.slice(14).replace(/^0+/,'');
  return (pre ? pre + '-' : '') + num + '/' + bank;
}
function loadImg(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 1000); }; im.onerror = () => rej(new Error('img')); im.src = url; });
}
function clampCrop(c, W, H){
  const m = Math.min(W, H); c.size = Math.max(24, Math.min(c.size, m));
  c.cx = Math.max(c.size/2, Math.min(W - c.size/2, c.cx)); c.cy = Math.max(c.size/2, Math.min(H - c.size/2, c.cy)); return c;
}
async function findFace(im){
  const W = im.naturalWidth, H = im.naturalHeight;
  if('FaceDetector' in window){
    try{ const r = await new FaceDetector({fastMode:false, maxDetectedFaces:5}).detect(im);
      if(r && r.length){ const b = r.sort((a,b) => b.boundingBox.width - a.boundingBox.width)[0].boundingBox; return {x:b.x, y:b.y, w:b.width, h:b.height}; } }catch(e){}
  }
  if(!(window.tracking && tracking.ViolaJones && tracking.ViolaJones.classifiers && tracking.ViolaJones.classifiers.face)) return null;
  const k = Math.min(1, 640 / Math.max(W, H)), w = Math.round(W * k), h = Math.round(H * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', {willReadFrequently:true}); ctx.drawImage(im, 0, 0, w, h);
  let r = [];
  try{ r = tracking.ViolaJones.detect(ctx.getImageData(0, 0, w, h).data, w, h, 1, 1.2, 1.5, 0.1, tracking.ViolaJones.classifiers.face) || []; }catch(e){}
  if(!r.length) return null;
  r.sort((a,b) => (b.total || 0) - (a.total || 0) || b.width - a.width);
  const f = r[0]; return {x:f.x / k, y:f.y / k, w:f.width / k, h:f.height / k};
}
function initialCrop(im, face){
  const W = im.naturalWidth, H = im.naturalHeight, m = Math.min(W, H);
  if(face) return clampCrop({cx:face.x + face.w/2, cy:face.y + face.h * 0.55, size:Math.max(face.w * 2.2, m * 0.12)}, W, H);
  if(H > W * 1.25) return clampCrop({cx:W/2, cy:W * 0.45, size:W * 0.9}, W, H);
  return clampCrop({cx:W/2, cy:H/2, size:m}, W, H);
}
async function makeAvatar(file){
  const im = await loadImg(file), sz = 192, cv = document.createElement('canvas'); cv.width = cv.height = sz;
  const m = Math.min(im.naturalWidth, im.naturalHeight);
  cv.getContext('2d').drawImage(im, (im.naturalWidth - m) / 2, (im.naturalHeight - m) / 2, m, m, 0, 0, sz, sz);
  return cv.toDataURL('image/jpeg', 0.8);
}
async function readQR(file){
  const im = await loadImg(file);
  if('BarcodeDetector' in window){
    try{ const d = new BarcodeDetector({formats:['qr_code']}); const r = await d.detect(im); if(r && r[0]) return r[0].rawValue; }catch(e){}
  }
  if(typeof jsQR !== 'function') throw new Error('nolib');
  for(const max of [1000, 1600, 700, 2400]){
    const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', {willReadFrequently:true}); ctx.drawImage(im, 0, 0, w, h);
    const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'attemptBoth'});
    if(r && r.data) return r.data;
  }
  return null;
}
function acctFromQR(text){
  if(!text) return null;
  const t = text.trim();
  const m = t.match(/ACC:([^*]+)/i);
  if(m){ const ib = toIBAN(m[1].split('+')[0]); if(ib) return ibanToLocal(ib); }
  const direct = toIBAN(t); if(direct) return ibanToLocal(direct);
  const any = t.replace(/\s+/g,'').match(/CZ\d{22}/i); if(any && toIBAN(any[0])) return ibanToLocal(any[0].toUpperCase());
  const loc = t.match(/(\d{1,6}-)?\d{2,10}\/\d{4}/); if(loc && toIBAN(loc[0])) return loc[0];
  return null;
}
const strikesOf = id => (S.cur && S.cur.strikes[id]) || 0;
const started = () => S.cur && S.cur.log.length > 0;
const alive = () => S.cur ? S.cur.parts.filter(id => strikesOf(id) < S.cur.limit) : [];
const pot = () => S.cur ? S.cur.stake * S.cur.parts.length : 0;
const czk = n => n === 1 ? 'lebka' : (n >= 2 && n <= 4) ? 'lebky' : 'lebek';

function syncCur(){
  const seated = S.players.filter(p => p.seated).map(p => p.id);
  if(!S.cur) S.cur = {id:uid(), parts:seated, stake:S.stake, limit:S.limit, strikes:{}, log:[]};
  else if(!started()){ S.cur.parts = seated; S.cur.stake = S.stake; S.cur.limit = S.limit; S.cur.strikes = {}; }
  S.cur.parts = S.cur.parts.filter(id => S.players.some(p => p.id === id));
}
function toast(msg, label, fn){
  const t = $('#toast'); t.textContent = msg;
  if(label){ const b = document.createElement('button'); b.textContent = label; b.onclick = () => { t.hidden = true; fn(); }; t.appendChild(b); }
  t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, label ? 4500 : 1800);
}
const ICON_TRASH = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
const OPEN = 104;
function closeRow(w){ const r = w.querySelector('.row'); r.style.transform = ''; w.classList.remove('open'); setTimeout(() => { if(!w.classList.contains('open')) w.classList.remove('sw-on'); }, 260); }
function trash(id){
  const p = P(id), snap = JSON.stringify(S);
  remember(p);
  S.players = S.players.filter(x => x.id !== id);
  if(S.cur){ S.cur.parts = S.cur.parts.filter(x => x !== id); delete S.cur.strikes[id]; S.cur.log = S.cur.log.filter(x => x !== id); }
  buzz(20); save(); flipRender();
  toast(`${p.name} je v koši`, 'Vrátit', () => { S = JSON.parse(snap); save(); render(); });
}
function bindSwipe(){
  document.querySelectorAll('.swipe').forEach(w => {
    const row = w.querySelector('.row'); let sx = 0, sy = 0, dx = 0, base = 0, drag = false, active = false;
    row.addEventListener('pointerdown', e => {
      if(e.button) return; sx = e.clientX; sy = e.clientY; dx = 0; drag = false; active = true;
      base = w.classList.contains('open') ? -OPEN : 0;
    });
    row.addEventListener('pointermove', e => {
      if(!active) return; const mx = e.clientX - sx, my = e.clientY - sy;
      if(!drag){
        if(Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.2){
          drag = true; try{ row.setPointerCapture(e.pointerId); }catch(_){}
          w.classList.add('sw-on'); document.querySelectorAll('.swipe.open').forEach(o => o !== w && closeRow(o));
        } else if(Math.abs(my) > 10) active = false;
        return;
      }
      dx = Math.min(0, base + mx); row.style.transition = 'none'; row.style.transform = `translateX(${dx}px)`;
    });
    const end = () => {
      if(!active) return; active = false; if(!drag) return;
      row.style.transition = ''; const W = w.offsetWidth;
      w._drag = true; setTimeout(() => w._drag = false, 60);
      if(dx < -W * 0.55){ row.style.transform = `translateX(${-W}px)`; setTimeout(() => trash(w.dataset.row), 200); }
      else if(dx < -56){ row.style.transform = `translateX(${-OPEN}px)`; w.classList.add('open'); }
      else closeRow(w);
    };
    row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end);
    row.addEventListener('click', e => {
      if(w._drag || w.classList.contains('open')){ e.stopPropagation(); e.preventDefault(); if(!w._drag) closeRow(w); }
    }, true);
  });
  document.querySelectorAll('[data-trash]').forEach(b => b.onclick = () => trash(b.dataset.trash));
}
document.addEventListener('pointerdown', e => { document.querySelectorAll('.swipe.open').forEach(w => { if(!w.contains(e.target)) closeRow(w); }); });
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* ---------- money ---------- */
function nets(){
  const n = {}; S.players.forEach(p => n[p.id] = 0);
  S.rounds.forEach(r => { r.parts.forEach(id => n[id] = (n[id]||0) - r.stake); Object.entries(r.pay).forEach(([id,a]) => n[id] = (n[id]||0) + a); });
  return n;
}
function settle(n){
  const deb = [], cred = [];
  Object.entries(n).forEach(([id,a]) => { if(a < 0) deb.push({id, a:-a}); else if(a > 0) cred.push({id, a}); });
  deb.sort((x,y) => y.a - x.a); cred.sort((x,y) => y.a - x.a);
  const out = []; let i = 0, j = 0;
  while(i < deb.length && j < cred.length){
    const m = Math.min(deb[i].a, cred[j].a);
    if(m > 0) out.push({from:deb[i].id, to:cred[j].id, a:m});
    deb[i].a -= m; cred[j].a -= m;
    if(deb[i].a === 0) i++;
    if(cred[j].a === 0) j++;
  }
  return out;
}
function mod97(str){ let r = 0; for(const c of str){ const v = /\d/.test(c) ? +c : c.charCodeAt(0) - 55; r = (v > 9 ? (r*100 + v) : (r*10 + v)) % 97; } return r; }
function toIBAN(raw){
  if(!raw) return null;
  const s = raw.replace(/\s+/g,'').toUpperCase();
  if(/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return mod97(s.slice(4) + s.slice(0,4)) === 1 ? s : null;
  const m = s.match(/^(?:(\d{1,6})-)?(\d{2,10})\/(\d{4})$/);
  if(!m) return null;
  const bban = m[3] + (m[1]||'').padStart(6,'0') + m[2].padStart(10,'0');
  return 'CZ' + String(98 - mod97(bban + 'CZ00')).padStart(2,'0') + bban;
}
const plain = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[*]/g,' ');
const spd = (iban, amount, msg) => `SPD*1.0*ACC:${iban}*AM:${amount.toFixed(2)}*CC:CZK*MSG:${plain(msg).slice(0,60)}`;
function qrSvg(text){ try{ const q = qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }catch(e){ return null; } }

/* ---------- game actions ---------- */
function plus(id){
  const c = S.cur; if(!c || strikesOf(id) >= c.limit || alive().length < 2) return;
  c.strikes[id] = strikesOf(id) + 1; c.log.push(id); lastHit = id;
  save();
  if(strikesOf(id) >= c.limit){
    buzz([30,40,30]); pendingOut = id; render(); wake();
    clearTimeout(plus._t);
    plus._t = setTimeout(() => { pendingOut = null; flipRender(); }, 1000);
    return;
  }
  buzz(15); render(); wake();
}
function minus(id){
  const c = S.cur; if(!c || !strikesOf(id)) return;
  c.strikes[id]--; const k = c.log.lastIndexOf(id); if(k > -1) c.log.splice(k,1);
  buzz(8); save(); render();
}
function finishRound(pay, kind){
  const c = S.cur;
  S.rounds.push({id:c.id, no:S.rounds.length + 1, parts:c.parts.slice(), stake:c.stake, pay, kind, ts:Date.now()});
  S.cur = null; S.sample = false; save(); closeSheet(); render();
  toast(kind === 'split' ? 'Bank rozdělen · nové kolo' : 'Výhra zapsána · nové kolo');
}

/* ---------- main view ---------- */
function render(){
  syncCur();
  const c = S.cur, al = alive(), total = pot();
  const playing = c.parts.map(P);
  const bench = S.players.filter(p => !c.parts.includes(p.id));
  const isOut = id => strikesOf(id) >= c.limit && id !== pendingOut;
  const order = c.parts.slice().sort((a,b) => isOut(a) - isOut(b));
  const finished = al.length === 1 && c.parts.length >= 2 && !pendingOut;
  const sameScore = al.length > 1 && al.every(id => strikesOf(id) === strikesOf(al[0]));
  const canSplit = !pendingOut && started() && al.length >= 2 && (al.length === 2 || (al.length * 2 <= c.parts.length && sameScore));

  $('#main').innerHTML = `
    <div class="bank">
      <div><div class="lbl">Bank · kolo ${S.rounds.length + 1}</div>
        <div class="amt num">${total.toLocaleString('cs-CZ')}<small>Kč</small></div></div>
      <div class="meta"><b>${playing.length}</b> × ${kc(c.stake)}<br>OUT na ${c.limit}. lebce${started() ? ` · hraje <b>${al.length}</b>` : ''}</div>
    </div>
    <div class="rows">
      ${order.length ? order.map(id => {
        const p = P(id), s = strikesOf(id), out = isOut(id), danger = !out && s === c.limit - 1 && al.length > 1;
        const isWin = finished && al[0] === id;
        let dots = ''; for(let i = 0; i < c.limit; i++) dots += `<i class="dot ${i < s ? 'on' : ''} ${i === s-1 && lastHit === id ? 'pop' : ''}"></i>`;
        const st = isWin ? `vítěz · +${kc(total - c.stake)}` : out ? `−${kc(c.stake)}` : danger ? 'poslední život' : s ? `${s} ${czk(s)}` : '';
        return `<div class="swipe" data-row="${id}"><button class="trash" data-trash="${id}" tabindex="-1" aria-label="Odstranit ${esc(p.name)}">${ICON_TRASH}<span>Koš</span></button><div class="row ${out ? 'out' : ''} ${danger ? 'danger' : ''} ${isWin ? 'win' : ''}" style="${cvars(p.color)}">
          <button class="who" data-edit="${id}" aria-label="Upravit ${esc(p.name)}">${avatar(p)}<span class="tx"><span class="nm">${esc(p.name)}</span><span class="st">${st}</span></span></button>
          <button class="pm" data-minus="${id}" ${s ? '' : 'disabled'} aria-label="Vrátit lebku">${ICON_MINUS}</button>
          ${out ? `<div class="out-tag">OUT</div>` : `<div class="dots" aria-label="${s} z ${c.limit}">${dots}</div>`}
          <button class="pm" data-plus="${id}" ${out || al.length < 2 ? 'disabled' : ''} aria-label="Přidat lebku">${ICON_PLUS}</button>
        </div></div>`;
      }).join('') : `<div class="emptyrow">Přidejte hráče tlačítkem + vpravo nahoře.</div>`}
    </div>
    ${c.parts.length === 1 ? `<p class="note">Ke hře jsou potřeba aspoň dva hráči.</p>` : ''}
    ${bench.length ? `<div class="bench"><h3>Mimo hru</h3><div class="chips">
      ${bench.map(p => `<button class="chip" data-seat="${p.id}" style="${cvars(p.color)}">${avatar(p,'xs')}${esc(p.name)}</button>`).join('')}
      </div><p class="note">${started() ? 'Klepnutím přisedne od dalšího kola.' : 'Klepnutím přisedne ke hře.'}</p></div>` : ''}
    ${S.sample && !S.rounds.length && !started() ? `<p class="note">Jména jsou ukázková. Klepnutím na jméno ho přepíšete, přejetím doleva hráče hodíte do koše.</p>` : ''}
  `;
  lastHit = null;
  bindSwipe();
  document.querySelectorAll('[data-plus]').forEach(b => b.onclick = () => plus(b.dataset.plus));
  document.querySelectorAll('[data-minus]').forEach(b => b.onclick = () => minus(b.dataset.minus));
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openPlayer(b.dataset.edit));
  document.querySelectorAll('[data-seat]').forEach(b => b.onclick = () => {
    const p = P(b.dataset.seat); p.seated = true; save(); render();
    if(started()) toast(`${p.name} hraje od dalšího kola`);
  });
  if(started()) document.querySelectorAll('[data-seat]').forEach(b => { if(P(b.dataset.seat).seated) b.style.opacity = .5; });

  const dock = $('#dock');
  if(finished){
    const w = P(al[0]);
    dock.innerHTML = `<div class="in win" style="${cvars(w.color)}"><div class="txt">${esc(w.name)} bere bank<b class="num">${kc(total)}</b></div>
      <button class="btn inv" id="d-fin">Zapsat · další kolo</button></div>`;
    dock.hidden = false; $('#d-fin').onclick = () => finishRound({[al[0]]: total}, 'win');
  } else if(pendingOut){ dock.hidden = true; dock.innerHTML = '';
  } else if(canSplit){
    const title = al.length === 2 ? (c.parts.length === 2 ? 'Hrají jen dva' : 'Poslední dva') : `${al.length} hráči se stejným skóre`;
    dock.innerHTML = `<div class="in"><div class="txt">${title}<b>${al.map(id => esc(P(id).name)).join(', ')}</b></div>
      <button class="btn pri" id="d-split">Rozdělit bank</button></div>`;
    dock.hidden = false; $('#d-split').onclick = openSplit;
  } else { dock.hidden = true; dock.innerHTML = ''; }
}

/* ---------- sheets ---------- */
function openSheet(title, body, mount){
  const sh = $('#sheet');
  sh.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div>
    <div class="sh-head"><h2>${esc(title)}</h2><button class="close" id="sh-x" aria-label="Zavřít">${ICON_X}</button></div>${body}</div>`;
  sh.hidden = false; confirmKey = null;
  $('#sh-x').onclick = closeSheet;
  sh.onclick = e => { if(e.target === sh) closeSheet(); };
  mount && mount(sh);
}
function closeSheet(){ const sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; confirmKey = null; }

const ICON_QR = '<svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg>';
function forgetPerson(id, reopen){
  const k = S.people[id]; if(!k) return;
  if(S.players.some(p => p.id === id)){ toast(`${k.name} je u stolu, nejdřív ho odeberte ze hry`); reopen(); return; }
  if(S.rounds.some(r => r.parts.includes(id))){ toast(`${k.name} dnes hrál, smazat půjde po novém večeru`); reopen(); return; }
  const snap = JSON.stringify(S);
  delete S.people[id];
  S.parties.forEach(pt => pt.members = pt.members.filter(m => m !== id));
  save(); reopen();
  toast(`${k.name} smazán z databáze`, 'Vrátit', () => { S = JSON.parse(snap); save(); render(); reopen(); });
}
function bindPeopleSwipe(reopen){
  const OPENP = 76;
  document.querySelectorAll('.pswipe').forEach(w => {
    const pill = w.querySelector('.person'); let sx = 0, sy = 0, dx = 0, base = 0, drag = false, active = false;
    const close = () => { pill.style.transform = ''; w.classList.remove('open'); setTimeout(() => { if(!w.classList.contains('open')) w.classList.remove('on'); }, 220); };
    pill.addEventListener('pointerdown', e => { if(e.button) return; sx = e.clientX; sy = e.clientY; dx = 0; drag = false; active = true; base = w.classList.contains('open') ? -OPENP : 0; });
    pill.addEventListener('pointermove', e => {
      if(!active) return; const mx = e.clientX - sx, my = e.clientY - sy;
      if(!drag){
        if(Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my) * 1.2){
          drag = true; try{ pill.setPointerCapture(e.pointerId); }catch(_){}
          w.classList.add('on'); document.querySelectorAll('.pswipe.open').forEach(o => { if(o !== w){ o.querySelector('.person').style.transform = ''; o.classList.remove('open','on'); } });
        } else if(Math.abs(my) > 8) active = false;
        return;
      }
      dx = Math.min(0, base + mx); pill.style.transition = 'none'; pill.style.transform = `translateX(${dx}px)`;
    });
    const end = () => {
      if(!active) return; active = false; if(!drag) return;
      pill.style.transition = ''; w._drag = true; setTimeout(() => w._drag = false, 60);
      if(dx < -w.offsetWidth * 0.6){ pill.style.transform = `translateX(${-w.offsetWidth}px)`; setTimeout(() => forgetPerson(w.dataset.pid, reopen), 180); }
      else if(dx < -36){ pill.style.transform = `translateX(${-OPENP}px)`; w.classList.add('open'); }
      else close();
    };
    pill.addEventListener('pointerup', end); pill.addEventListener('pointercancel', end);
    pill.addEventListener('click', e => { if(w._drag || w.classList.contains('open')){ e.stopPropagation(); e.preventDefault(); if(!w._drag) close(); } }, true);
  });
  document.querySelectorAll('[data-ptrash]').forEach(b => b.onclick = () => forgetPerson(b.dataset.ptrash, reopen));
}
function openPlayer(id){
  const isNew = !id;
  const used = new Set(S.rounds.flatMap(r => r.parts).concat(started() ? S.cur.parts : []));
  const taken = new Set(S.players.map(p => p.color));
  const p = isNew ? {id:uid(), name:'', acct:'', photo:'', seated:true, color:COLORS.find(c => !taken.has(c)) || COLORS[S.players.length % COLORS.length]} : {...P(id)};
  const inGame = new Set(S.players.map(x => x.id));
  const known = isNew ? Object.values(S.people).filter(x => !inGame.has(x.id)).sort((a,b) => a.name.localeCompare(b.name, 'cs')) : [];
  let skulls = ''; for(let i = 0; i < Math.min(S.limit, 3); i++) skulls += `<i class="dot ${i === 0 ? 'on' : ''}"></i>`;
  const body = `
    ${known.length ? `<div class="gl">Vybrat z databáze</div>
      <div class="people">${known.map(k => `<span class="pswipe" data-pid="${k.id}"><span class="ptrash" data-ptrash="${k.id}">Smazat</span><button class="person" data-pick="${k.id}" style="${cvars(k.color)}">${avatar(k)}${esc(k.name)}</button></span>`).join('')}</div>
      <p class="hint" style="margin-top:0">Přejetím doleva hráče z databáze smažete.</p>
      <div class="divider">nebo nový hráč</div>` : ''}
    <div class="preview" id="pv" style="${cvars(p.color)}">
      <span style="display:flex;align-items:center;gap:12px;min-width:0"><span id="pv-av">${avatar(p)}</span><span id="pv-n" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name || 'Nový hráč')}</span></span>
      <span class="dots">${skulls}</span></div>
    <div class="photo">
      <label class="btn filebtn"><span id="ph-l">${p.photo ? 'Změnit fotku' : 'Přidat fotku'}</span><input type="file" id="pl-photo" accept="image/*" aria-label="Fotka hráče"></label>
      <button class="btn ghost" id="pl-nophoto" ${p.photo ? '' : 'hidden'}>Odebrat fotku</button>
    </div>
    <div class="cropper" id="crop" hidden>
      <canvas id="crop-cv" width="400" height="400" aria-label="Výřez fotky, posuňte prstem"></canvas>
      <div class="cz"><span aria-hidden="true">−</span><input type="range" class="range" id="crop-z" min="0" max="100" aria-label="Přiblížení"><span aria-hidden="true">+</span></div>
      <p class="hint" id="crop-msg" style="text-align:center"></p>
    </div>
    <div class="gl">Jméno</div>
    <input class="inp" id="pl-name" value="${esc(p.name)}" placeholder="Jméno hráče" autocomplete="off" maxlength="24">
    <div class="gl" style="margin-top:18px">Týmová barva</div>
    <div class="swatches">${COLORS.map(c => `<button class="sw" data-c="${c}" style="--c:${c}" aria-pressed="${c === p.color}" aria-label="Barva ${c}"></button>`).join('')}</div>
    <div class="gl">Číslo účtu pro QR Platbu</div>
    <div class="acctrow">
      <input class="inp" id="pl-acct" value="${esc(p.acct || '')}" placeholder="123456789/0800 nebo IBAN" autocomplete="off">
      <label class="btn filebtn">${ICON_QR}<span>Skenovat QR</span><input type="file" id="pl-scan" accept="image/*" aria-label="Načíst QR kód platby"></label>
    </div>
    <p class="hint">Hráč si v bankovní aplikaci vygeneruje QR kód pro platbu. Vyfoťte ho nebo vyberte snímek obrazovky a účet se doplní sám.</p>
    <div class="group"><div class="it"><label for="pl-seat">Hraje</label><span class="switch"><input type="checkbox" id="pl-seat" ${p.seated ? 'checked' : ''}><span></span></span></div></div>
    <div class="actions">
      ${!isNew ? `<button class="btn dng" id="pl-del" ${used.has(p.id) ? 'disabled title="Hráč už hrál, nejde smazat. Vypněte mu Hraje."' : ''}>Odebrat ze hry</button>` : ''}
      <span class="grow"></span>
      <button class="btn pri" id="pl-ok">${isNew ? 'Přidat hráče' : 'Uložit'}</button>
    </div>`;
  openSheet(isNew ? 'Přidat hráče' : 'Hráč', body, () => {
    const nm = $('#pl-name'), ac = $('#pl-acct');
    const refresh = () => {
      const view = {...p, name:nm.value.trim() || 'Nový hráč'};
      $('#pv').setAttribute('style', cvars(p.color)); $('#pv-av').innerHTML = avatar(view); $('#pv-n').textContent = view.name;
      $('#ph-l').textContent = p.photo ? 'Změnit fotku' : 'Přidat fotku'; $('#pl-nophoto').hidden = !p.photo;
    };
    nm.oninput = refresh;
    document.querySelectorAll('.sw').forEach(b => b.onclick = () => {
      p.color = b.dataset.c; document.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', String(x === b))); refresh();
    });
    let crop = null, cim = null;
    const cv = $('#crop-cv'), cz = $('#crop-z');
    const minSide = () => Math.min(cim.naturalWidth, cim.naturalHeight);
    const drawCrop = () => {
      clampCrop(crop, cim.naturalWidth, cim.naturalHeight);
      const g = cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height);
      g.drawImage(cim, crop.cx - crop.size/2, crop.cy - crop.size/2, crop.size, crop.size, 0, 0, cv.width, cv.height);
    };
    const commit = () => {
      const o = document.createElement('canvas'); o.width = o.height = 192;
      o.getContext('2d').drawImage(cim, crop.cx - crop.size/2, crop.cy - crop.size/2, crop.size, crop.size, 0, 0, 192, 192);
      p.photo = o.toDataURL('image/jpeg', 0.82); refresh();
    };
    const zFromSize = sz => Math.round((1 - sz / minSide()) / 0.88 * 100);
    cz.oninput = () => { const c0 = {...crop}; crop.size = minSide() * (1 - (+cz.value / 100) * 0.88); crop.cx = c0.cx; crop.cy = c0.cy; drawCrop(); };
    cz.onchange = commit;
    let drag = null;
    cv.addEventListener('pointerdown', e => { if(!crop) return; drag = {x:e.clientX, y:e.clientY, cx:crop.cx, cy:crop.cy}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
    cv.addEventListener('pointermove', e => {
      if(!drag) return; const k = crop.size / cv.getBoundingClientRect().width;
      crop.cx = drag.cx - (e.clientX - drag.x) * k; crop.cy = drag.cy - (e.clientY - drag.y) * k; drawCrop();
    });
    const endDrag = () => { if(drag){ drag = null; commit(); } };
    cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
    $('#pl-photo').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if(!f) return;
      try{
        cim = await loadImg(f);
        $('#crop-msg').textContent = 'Hledám obličej…'; $('#crop').hidden = false;
        await new Promise(r => setTimeout(r, 30));
        const face = await findFace(cim);
        crop = initialCrop(cim, face); cz.value = zFromSize(crop.size); drawCrop(); commit();
        $('#crop-msg').textContent = face ? 'Obličej nalezen. Výřez můžete posunout prstem nebo přiblížit.' : 'Obličej se nenašel. Posuňte výřez prstem a přibližte posuvníkem.';
      }catch(err){ $('#crop').hidden = true; toast('Fotku se nepodařilo načíst'); }
    };
    $('#pl-nophoto').onclick = () => { p.photo = ''; crop = null; $('#crop').hidden = true; refresh(); };
    $('#pl-scan').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if(!f) return;
      toast('Hledám QR kód…');
      try{
        const txt = await readQR(f), acct = acctFromQR(txt);
        if(acct){ ac.value = acct; ac.classList.remove('bad'); toast('Účet načten: ' + acct); }
        else toast(txt ? 'QR kód neobsahuje číslo účtu' : 'QR kód se nenašel, zkuste ostřejší fotku');
      }catch(err){ toast('QR kód se nepodařilo přečíst'); }
    };
    ac.onblur = () => ac.classList.toggle('bad', !!ac.value.trim() && !toIBAN(ac.value));
    bindPeopleSwipe(() => openPlayer(null));
    document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const k = S.people[b.dataset.pick]; S.players.push({...k, seated:true}); S.sample = false;
      save(); closeSheet(); render(); toast(`${k.name} přisedl ke stolu`);
    });
    $('#pl-ok').onclick = () => {
      const name = nm.value.trim(); if(!name){ nm.focus(); nm.classList.add('bad'); return; }
      const acct = ac.value.trim(); if(acct && !toIBAN(acct)){ ac.classList.add('bad'); ac.focus(); toast('Číslo účtu nesedí, zkontrolujte ho'); return; }
      const seated = $('#pl-seat').checked;
      let target;
      if(isNew){ target = {...p, name, acct, seated}; S.players.push(target); S.sample = false; }
      else { target = P(id); Object.assign(target, {name, acct, color:p.color, photo:p.photo || '', seated}); }
      remember(target);
      if(started() && !isNew && S.cur.parts.includes(id) && !seated) toast(`${name} skončí po tomto kole`);
      save(); closeSheet(); render();
    };
    const del = $('#pl-del');
    del && (del.onclick = () => {
      if(confirmKey === 'del'){ remember(P(id)); S.players = S.players.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Hráč zůstává v databázi'); }
      else { confirmKey = 'del'; del.textContent = 'Opravdu odebrat?'; }
    });
    if(isNew && !known.length) nm.focus();
  });
}

function openParties(){
  const cur = S.players, list = S.parties;
  const inParty = new Set(list.flatMap(pt => pt.members));
  const inRounds = new Set(S.rounds.flatMap(r => r.parts));
  const inGame = new Set(cur.map(x => x.id));
  const people = Object.values(S.people).sort((a,b) => a.name.localeCompare(b.name, 'cs'));
  const body = `
    <p class="hint" style="margin-top:-8px">Parta si pamatuje jména, barvy, fotky a čísla účtů. Uložit můžete až 5 part.</p>
    ${list.length ? `<div class="group">${list.map(pt => {
      const mem = pt.members.map(id => S.people[id]).filter(Boolean);
      return `<div class="party"><div class="pi"><div class="pn">${esc(pt.name)}</div>
          <div class="pm2">${mem.length} hráčů · ${mem.map(m => esc(m.name)).join(', ')}</div>
          <div class="stack">${mem.slice(0,10).map(m => avatar(m,'xs')).join('')}</div></div>
        <div class="pb"><button class="btn sm pri" data-load="${pt.id}">Načíst</button><button class="btn sm" data-over="${pt.id}">Přepsat</button><button class="btn sm ghost" data-pdel="${pt.id}">Smazat</button></div></div>`;
    }).join('')}</div>` : `<div class="group"><div class="empty">Zatím žádná uložená parta.</div></div>`}
    <div class="gl">Uložit aktuální sestavu <span class="count">· ${list.length}/5</span></div>
    ${list.length >= 5 ? `<p class="hint">Máte uložených 5 part. Smažte nebo přepište některou z nich.</p>`
      : `<div class="acctrow"><input class="inp" id="pt-name" placeholder="Název, např. Čtvrteční prší" maxlength="30" autocomplete="off"><button class="btn pri" id="pt-save" ${cur.length ? '' : 'disabled'}>Uložit</button></div>
         <p class="hint">${cur.length ? `Uloží se ${cur.length} hráčů: ${cur.map(x => esc(x.name)).join(', ')}.` : 'Nejdřív přidejte hráče.'}</p>`}
    ${people.length ? `<div class="gl">Databáze hráčů</div>
      <div class="people">${people.map(k => {
        return `<span class="pswipe" data-pid="${k.id}"><span class="ptrash" data-ptrash="${k.id}">Smazat</span><span class="person" style="${cvars(k.color)}">${avatar(k)}${esc(k.name)}</span></span>`;
      }).join('')}</div>
      <p class="hint">Přejetím doleva hráče z databáze smažete. Smaže se i ze všech part.</p>` : ''}
    <div class="gl">Přenos do jiné aplikace</div>
    <div class="group"><div class="it"><span>Zkopíruje všechny party i s fotkami a účty jako kód.</span><button class="btn sm pri" id="pt-exp" ${list.length ? '' : 'disabled'}>Kopírovat</button></div>
      <div class="it"><span>Vloží kód zkopírovaný z jiné aplikace.</span><button class="btn sm" id="pt-imp">Vložit</button></div>
      <div class="it"><span>Uloží party jako soubor (Soubory, AirDrop, zpráva).</span><button class="btn sm" id="pt-fexp" ${list.length ? '' : 'disabled'}>Sdílet soubor</button></div>
      <div class="it"><span>Načte party ze souboru.</span><label class="btn sm filebtn">Otevřít soubor<input type="file" id="pt-fimp" accept=".json,application/json,text/plain"></label></div></div>
    <textarea class="inp" id="pt-code" rows="4" hidden placeholder="Sem vložte kód (podržte prst → Vložit)" style="margin:-6px 0 10px;font-size:13px"></textarea>
    <div class="actions" id="pt-impbar" hidden style="margin:0 0 16px"><span class="grow"></span><button class="btn pri" id="pt-load">Načíst party</button></div>`;
  openSheet('Party', body, () => {
    const code = $('#pt-code');
    const exportText = () => {
      const ids = new Set(S.parties.flatMap(pt => pt.members));
      const data = {v:1, parties:S.parties, people:[...ids].map(id => S.people[id]).filter(Boolean)};
      return 'PRSI1:' + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    };
    const importText = raw => {
      let t = String(raw || '');
      const at = t.indexOf('PRSI1:'); if(at > -1) t = t.slice(at + 6);
      t = t.replace(/-/g, '+').replace(/_/g, '/').replace(/[^A-Za-z0-9+/]/g, '');
      if(!t){ toast('Kód je prázdný'); return; }
      while(t.length % 4) t += '=';
      let data;
      try{ data = JSON.parse(decodeURIComponent(escape(atob(t)))); }
      catch(e){ toast(`Kód je neúplný nebo poškozený (${t.length} znaků). Zkuste přenos souborem.`); return; }
      (data.people || []).forEach(k => { if(k && k.id) S.people[k.id] = {id:k.id, name:k.name, acct:k.acct || '', color:k.color || COLORS[0], photo:k.photo || ''}; });
      let added = 0, skipped = 0;
      (data.parties || []).forEach(pt => {
        const i = S.parties.findIndex(x => x.id === pt.id);
        if(i > -1){ S.parties[i] = pt; added++; }
        else if(S.parties.length < 5){ S.parties.push(pt); added++; }
        else skipped++;
      });
      save(); openParties();
      toast(skipped ? `Načteno ${added}, ${skipped} se nevešly (max 5 part)` : `Načteno part: ${added}`);
    };
    const fx = $('#pt-fexp');
    fx && (fx.onclick = async () => {
      const txt = exportText();
      const file = new File([txt], 'prsi-bank-party.json', {type:'application/json'});
      try{
        if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Prší Bank – party'}); return; }
      }catch(e){ if(e && e.name === 'AbortError') return; }
      try{
        const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      }catch(e){ toast('Soubor se nepodařilo uložit'); }
    });
    $('#pt-fimp').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if(!f) return;
      try{ importText(await f.text()); }catch(err){ toast('Soubor se nepodařilo přečíst'); }
    };
    const ex = $('#pt-exp');
    ex && (ex.onclick = () => {
      const txt = exportText();
      const fb = () => { code.hidden = false; code.value = txt; code.select(); toast('Kód je označený, zkopírujte ho'); };
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Party zkopírovány, vložte je v druhé aplikaci'), fb); else fb();
    });
    $('#pt-imp').onclick = () => { code.hidden = false; code.value = ''; $('#pt-impbar').hidden = false; code.focus(); };
    $('#pt-load').onclick = () => importText(code.value);
    const ps = $('#pt-save');
    ps && (ps.onclick = () => {
      const name = $('#pt-name').value.trim() || `Parta ${list.length + 1}`;
      cur.forEach(remember);
      S.parties.push({id:uid(), name, members:cur.map(x => x.id), ts:Date.now()});
      save(); openParties(); toast(`Parta „${name}“ uložena`);
    });
    document.querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
      const pt = S.parties.find(x => x.id === b.dataset.load);
      const busy = S.rounds.length || started();
      if(busy && confirmKey !== 'load' + pt.id){ confirmKey = 'load' + pt.id; b.textContent = 'Smaže kola, načíst?'; b.classList.replace('pri','dng'); return; }
      S.players = pt.members.map(id => S.people[id]).filter(Boolean).map(k => ({...k, seated:true}));
      S.rounds = []; S.cur = null; S.sample = false;
      save(); closeSheet(); render(); toast(`Hraje parta „${pt.name}“`);
    });
    document.querySelectorAll('[data-over]').forEach(b => b.onclick = () => {
      const pt = S.parties.find(x => x.id === b.dataset.over);
      if(confirmKey !== 'over' + pt.id){ confirmKey = 'over' + pt.id; b.textContent = 'Opravdu přepsat?'; return; }
      cur.forEach(remember); pt.members = cur.map(x => x.id); pt.ts = Date.now();
      save(); openParties(); toast('Parta přepsána aktuální sestavou');
    });
    document.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => {
      const pid = b.dataset.pdel;
      if(confirmKey !== 'pdel' + pid){ confirmKey = 'pdel' + pid; b.textContent = 'Opravdu?'; b.classList.add('dng'); return; }
      S.parties = S.parties.filter(x => x.id !== pid); save(); openParties(); toast('Parta smazána');
    });
    bindPeopleSwipe(openParties);
  });
}

function openSettings(){
  const body = `
    <div class="group">
      <div class="it"><label for="st-stake">Vklad na kolo</label><input class="inp sm num" id="st-stake" type="number" inputmode="numeric" min="1" step="10" value="${S.stake}"></div>
      <div class="it"><label for="st-limit">Lebek do OUT</label><input class="inp sm num" id="st-limit" type="number" inputmode="numeric" min="1" max="6" value="${S.limit}"></div>
    </div>
    <p class="hint">${started() ? 'Rozehrané kolo dojede podle původního nastavení, změna platí od dalšího kola.' : 'Platí pro toto i další kola.'}</p>
    <div class="gl">Rozehrané kolo</div>
    <div class="group"><div class="it"><span>Smazat všechny lebky v tomto kole</span><button class="btn sm dng" id="st-round" ${started() ? '' : 'disabled'}>Vynulovat</button></div></div>
    <div class="gl">Nový večer</div>
    <div class="group"><div class="it"><span>Smaže všechna kola. Hráči, barvy a účty zůstanou.</span><button class="btn sm dng" id="st-reset">Začít znovu</button></div></div>
    <div class="gl">Výchozí stav</div>
    <div class="group"><div class="it"><span>Smaže hráče ze stolu i všechna kola. Party a databáze hráčů zůstanou.</span><button class="btn sm dng" id="st-default">Obnovit</button></div></div>`;
  openSheet('Nastavení', body, () => {
    $('#st-stake').onchange = e => { const x = Math.max(1, Math.round(+e.target.value || 100)); S.stake = x; e.target.value = x; save(); render(); };
    $('#st-limit').onchange = e => { const x = Math.max(1, Math.min(6, Math.round(+e.target.value || 3))); S.limit = x; e.target.value = x; save(); render(); };
    $('#st-round').onclick = e => {
      if(confirmKey === 'round'){ S.cur = null; save(); closeSheet(); render(); toast('Kolo vynulováno'); }
      else { confirmKey = 'round'; e.target.textContent = 'Opravdu?'; }
    };
    $('#st-default').onclick = e => {
      if(confirmKey === 'default'){
        S.players.forEach(remember);
        const fresh = seed(); S.players = fresh.players; S.rounds = []; S.cur = null; S.sample = false;
        S.players.forEach(remember); save(); closeSheet(); render(); toast('Obnoveno do výchozího stavu');
      } else { confirmKey = 'default'; e.target.textContent = 'Opravdu?'; }
    };
    $('#st-reset').onclick = e => {
      if(confirmKey === 'reset'){ S.rounds = []; S.cur = null; save(); closeSheet(); render(); toast('Nový večer připraven'); }
      else { confirmKey = 'reset'; e.target.textContent = 'Opravdu smazat?'; }
    };
  });
}

function openSplit(){
  const c = S.cur, ids = alive(), total = pot(), n = ids.length;
  const ss = ids.map(strikesOf), equal = ss.every(x => x === ss[0]);
  const evenShares = () => { const base = Math.floor(total / n), rest = total - base * n; return ids.map((_,i) => base + (i < rest ? 1 : 0)); };
  let shares;
  if(equal) shares = evenShares();
  else {
    const lives = ss.map(s => c.limit - s), L = lives.reduce((a,b) => a + b, 0);
    shares = lives.map(l => Math.round(total * l / L)); shares[0] += total - shares.reduce((a,b) => a + b, 0);
  }
  const body = `
    <p class="hint" style="margin-top:-8px">${equal ? `Všichni mají ${ss[0]} ${czk(ss[0])}, předvyplněno rovným dílem.` : 'Předvyplněno podle zbývajících životů.'} Částky přepište podle vaší dohody.</p>
    <div class="duo">${ids.map((id,i) => { const p = P(id); return `
      <div class="p" style="${cvars(p.color)}"><div class="n">${esc(p.name)}</div><div class="s">${ss[i]} ${czk(ss[i])}</div>
        <input data-i="${i}" type="number" inputmode="numeric" min="0" max="${total}" aria-label="Částka pro ${esc(p.name)}"><div class="net" data-net="${i}"></div></div>`; }).join('')}
    </div>
    ${n === 2 ? `<input class="range" id="sp-r" type="range" min="0" max="100" step="5" aria-label="Poměr">
    <div class="presets">${[50,60,70,80].map(x => `<button class="btn sm" data-p="${x}">${x} / ${100-x}</button>`).join('')}<button class="btn sm" data-p="30">30 / 70</button></div>`
    : `<div class="presets"><button class="btn sm" id="sp-even">Rovným dílem</button></div>`}
    <div class="err" id="sp-err"></div>
    <div class="actions"><span class="grow"></span><button class="btn pri" id="sp-ok">Zapsat dělbu</button></div>`;
  openSheet(`Rozdělit ${kc(total)}`, body, () => {
    const inputs = [...document.querySelectorAll('.duo input')];
    const vals = () => inputs.map(x => Math.round(+x.value || 0));
    const fill = arr => { arr.forEach((v,i) => inputs[i].value = v); upd(); };
    const upd = () => {
      const v = vals(), sum = v.reduce((a,b) => a + b, 0);
      v.forEach((a,i) => document.querySelector(`[data-net="${i}"]`).textContent = `${total ? Math.round(a/total*100) : 0} % · čistě ${signed(a - c.stake)}`);
      const err = v.some(a => a < 0) ? 'Částky nesmí být záporné.' : sum !== total ? (sum < total ? `Zbývá rozdělit ${kc(total - sum)}.` : `Rozděleno o ${kc(sum - total)} víc, než je v banku.`) : '';
      $('#sp-err').textContent = err; $('#sp-ok').disabled = !!err;
    };
    fill(shares);
    if(n === 2){
      const r = $('#sp-r');
      const setPct = x => { const A = Math.round(total * x / 100); r.value = x; fill([A, total - A]); };
      r.value = total ? Math.round(shares[0] / total * 100) : 50;
      inputs[0].oninput = () => { const A = Math.max(0, Math.min(total, Math.round(+inputs[0].value || 0))); inputs[1].value = total - A; r.value = total ? Math.round(A/total*100) : 50; upd(); };
      inputs[1].oninput = () => { const B = Math.max(0, Math.min(total, Math.round(+inputs[1].value || 0))); inputs[0].value = total - B; r.value = total ? Math.round((total-B)/total*100) : 50; upd(); };
      r.oninput = () => setPct(+r.value);
      document.querySelectorAll('[data-p]').forEach(x => x.onclick = () => setPct(+x.dataset.p));
    } else {
      inputs.forEach(x => x.oninput = upd);
      $('#sp-even').onclick = () => fill(evenShares());
    }
    $('#sp-ok').onclick = () => {
      const v = vals(); if(v.reduce((a,b) => a + b, 0) !== total || v.some(a => a < 0)) return;
      const pay = {}; ids.forEach((id,i) => { if(v[i]) pay[id] = v[i]; }); finishRound(pay, 'split');
    };
  });
}

const tag = id => { const p = P(id); return `<span class="tag" style="${cvars(p.color)}">${avatar(p,'xs')}${esc(p.name)}</span>`; };
function openPay(){
  const n = nets(), tx = settle(n);
  const played = [...new Set(S.rounds.flatMap(r => r.parts))];
  const even = played.filter(id => n[id] === 0);
  const today = new Date().toLocaleDateString('cs-CZ');
  const report = tx.map(t => `${P(t.from).name} zaplatí ${P(t.to).name} ${kc(t.a)}`).concat(even.map(id => `${P(id).name} zůstává na svých`)).join('\n');
  const max = Math.max(1, ...played.map(id => Math.abs(n[id])));
  const nr = S.rounds.length;
  const body = `
    <p class="hint" style="margin-top:-8px">${nr} ${nr === 1 ? 'odehrané kolo' : (nr >= 2 && nr <= 4) ? 'odehraná kola' : 'odehraných kol'} · ${today}${started() ? ' · rozehrané kolo se nepočítá' : ''}</p>
    ${played.length ? `<div class="gl">Bilance večera</div><div class="group">
      ${played.sort((x,y) => n[y] - n[x]).map(id => { const a = n[id], p = P(id);
        return `<div class="bal" style="${cvars(p.color)}"><div class="w">${esc(p.name)}</div>
          <div class="track"><div class="fill ${a >= 0 ? 'pos' : 'neg'}" style="width:${Math.abs(a)/max*50}%"></div></div>
          <div class="a num ${a > 0 ? 'pos-t' : a < 0 ? 'neg-t' : 'muted'}">${signed(a)}</div></div>`; }).join('')}
    </div>` : ''}
    <div class="gl">Kdo komu zaplatí</div>
    <div class="group">
      ${tx.length ? tx.map((t,i) => {
        const ib = toIBAN(P(t.to).acct);
        return `<div class="xf"><div class="tx">${tag(t.from)}<span class="arrow">→</span>${tag(t.to)}</div><div class="money num">${kc(t.a)}</div>
          ${ib ? `<button class="btn sm pri" data-qr="${i}">QR</button>` : ''}
          <div class="qrbox" id="qr-${i}" hidden></div></div>`;
      }).join('') : `<div class="empty">${nr ? 'Všichni jsou vyrovnaní.' : 'Po prvním odehraném kole se tu objeví převody.'}</div>`}
      ${even.map(id => `<div class="xf"><div class="tx">${tag(id)}<span class="muted">zůstává na svých</span></div></div>`).join('')}
    </div>
    ${tx.length ? `<div class="actions" style="margin:-4px 0 16px"><button class="btn" id="py-copy">Zkopírovat jako text</button></div>
      <textarea class="inp" id="py-rep" rows="${Math.min(8, tx.length + even.length)}" readonly hidden style="margin-bottom:16px">${esc(report)}</textarea>` : ''}
    ${tx.some(t => !toIBAN(P(t.to).acct)) ? `<p class="hint" style="margin-top:-8px">QR kód se zobrazí u hráčů, kteří mají vyplněný účet. Doplníte ho klepnutím na jméno hráče.</p>` : ''}
    ${nr ? `<div class="gl">Odehraná kola</div><div class="group hist">
      ${S.rounds.slice().reverse().map(r => `<div class="h"><div class="no num">${r.no}</div>
        <div class="d">${Object.entries(r.pay).map(([id,a]) => `${tag(id)}<span class="num" style="font-weight:700">${kc(a)}</span>`).join(' ')}
          <small>${r.kind === 'split' ? 'Dělba · ' : ''}${r.parts.length} × ${kc(r.stake)} = ${kc(r.parts.length * r.stake)}</small></div>
        <button class="btn sm ghost" data-rdel="${r.id}">Smazat</button></div>`).join('')}
    </div>` : ''}`;
  openSheet('Vyúčtování', body, () => {
    document.querySelectorAll('[data-qr]').forEach(b => b.onclick = () => {
      const t = tx[+b.dataset.qr], box = $('#qr-' + b.dataset.qr);
      if(!box.hidden){ box.hidden = true; return; }
      const to = P(t.to), ib = toIBAN(to.acct), msg = `Prsi ${today} ${P(t.from).name}`, svg = qrSvg(spd(ib, t.a, msg));
      box.innerHTML = (svg ? `<div class="qr">${svg}</div>` : '') + `<div class="qrmeta">Naskenujte v bankovní aplikaci.<br>Příjemce <b>${esc(to.name)}</b><br>Účet <b class="num">${esc(to.acct)}</b><br>Částka <b>${kc(t.a)}</b><br>Zpráva ${esc(plain(msg))}${svg ? '' : '<br>QR se nenačetl, zadejte platbu podle údajů.'}</div>`;
      box.hidden = false;
    });
    const cp = $('#py-copy');
    cp && (cp.onclick = () => {
      const ta = $('#py-rep'); const fb = () => { ta.hidden = false; ta.select(); toast('Text je označený, zkopírujte ho'); };
      if(navigator.clipboard) navigator.clipboard.writeText(report).then(() => toast('Zkopírováno'), fb); else fb();
    });
    document.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => {
      if(confirmKey === 'r' + b.dataset.rdel){ S.rounds = S.rounds.filter(r => r.id !== b.dataset.rdel); S.rounds.forEach((r,i) => r.no = i + 1); save(); render(); openPay(); toast('Kolo smazáno'); }
      else { confirmKey = 'r' + b.dataset.rdel; b.textContent = 'Opravdu?'; b.classList.add('dng'); }
    });
  });
}

/* ---------- misc ---------- */
let lock = null;
async function wake(){ try{ if('wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } }catch(e){} }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && started()) wake(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#b-set').onclick = openSettings;
$('#b-party').onclick = openParties;
$('#b-pay').onclick = openPay;
$('#b-add').onclick = () => openPlayer(null);

const start = () => render();
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>

  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
